<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#063D2C">
  <title>Set up · KenduriFlow</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <span class="logo"><span class="logo-mark" aria-hidden="true">K</span>KenduriFlow</span>
    </div>
  </header>

  <main class="auth">
    <div class="auth-brand">
      <img src="/icons/icon-192.png" alt="">
      <h1>Set up KenduriFlow</h1>
      <p class="muted" style="margin:0">Create the first township team account. You can add residents and guards next.</p>
    </div>

    <section class="card">
      <form id="setupForm" novalidate>
        <div class="field">
          <label for="key">Setup key</label>
          <input type="text" id="key" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="8 letters and numbers" required>
          <span class="hint">Printed in the server terminal when KenduriFlow starts. It works once.</span>
        </div>
        <div class="field">
          <label for="name">Your name</label>
          <input type="text" id="name" maxlength="60" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="phone">Your mobile number</label>
          <div class="phone-field"><span>+60</span><input type="tel" id="phone" inputmode="tel" autocomplete="tel-national" placeholder="12-345 6712" required></div>
          <span class="hint">You sign in with this number from now on.</span>
        </div>
        <div class="form-error" id="err" role="alert" hidden></div>
        <button class="btn block" type="submit" id="go">Create township account</button>
      </form>
    </section>
  </main>

  <script type="module" src="/js/setup.js"></script>
</body>
</html>
