<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#063D2C">
  <title>People · KenduriFlow</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KenduriFlow">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="has-tabs">
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="logo" href="/"><span class="logo-mark" aria-hidden="true">K</span>KenduriFlow</a>
      <nav class="nav" aria-label="Main" id="nav"></nav>
      <span class="conn" id="conn">Connecting</span>
      <a class="avatar" id="avatar" href="/login" hidden></a>
    </div>
  </header>

  <main class="container page">
    <div class="page-head">
      <div>
        <p class="eyebrow">Township team</p>
        <h1>People</h1>
        <p class="sub">Residents, guards and the township team. Each person signs in with their own mobile number.</p>
      </div>
    </div>
    <div id="welcome"></div>

    <div style="max-width:760px;padding-bottom:90px">
      <div class="segtabs" id="tabs">
        <button type="button" data-tab="resident">Residents</button>
        <button type="button" data-tab="guard">Guards</button>
        <button type="button" data-tab="township">Township team</button>
      </div>
      <p class="small muted" id="count" style="margin:-6px 4px 10px"></p>
      <ul class="rows" id="people"><li style="padding:16px"><div class="skel" style="height:52px"></div></li></ul>
      <button class="btn secondary block" type="button" id="bulkOpen" style="margin-top:14px">Add many people at once</button>
    </div>
  </main>

  <button class="fab" type="button" id="fab"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add person</button>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/people.js"></script>
</body>
</html>
